[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-analyzer"
version = "0.3.7-beta"
description = "DanmakuScope - B站弹幕社会语言学分析工具"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "DanmakuScope Team"}
]
dependencies = [
    "jieba>=0.42.1",
    "regex>=2023.6.3",
    "emoji>=2.8.0",
    "openai>=1.30.0",
    "tenacity>=8.2.2",
    "tiktoken>=0.5.1",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "bilibili-api-python>=16.0.0",
    "httpx>=0.24.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    # ruptures 1.1.x 仅提供至 cp313 的编译 wheel（无 cp314、无纯 Python 回退）；
    # 以 PEP 508 环境标记分叉（pip/uv 均原生支持）：>=3.14 用 1.0.6 py3-none-any，其余平台用 1.1.x
    "ruptures>=1.1.7 ; python_version < '3.14'",
    "ruptures>=1.0.6,<1.1 ; python_version >= '3.14'",
    "click>=8.1.0",
    "rich>=13.0.0",
    "qrcode>=7.4",
    "loguru>=0.7.0",
    "pandas>=2.0.0",
    "textual>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.2.0",
    "ruff>=0.1.0",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.scripts]
danmaku-analyzer = "danmaku_analyzer.cli:main"
danmaku-tui = "danmaku_analyzer.tui.app:run_tui"

[tool.setuptools.packages.find]
include = ["danmaku_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["danmaku_analyzer"]
omit = [
    "tests/*",
    "scripts/*",
    "danmaku_analyzer/data/*",
    "danmaku_analyzer/lexicon/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.",
    "pass",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 50

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
