[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danmaku-analyzer"
version = "0.1.3-beta"
description = "DanmakuScope - B站弹幕社会语言学分析工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "DanmakuScope Team"}
]
dependencies = [
    "jieba>=0.42.1",
    "regex>=2023.6.3",
    "emoji>=2.8.0",
    "openai>=1.30.0",
    "tenacity>=8.2.2",
    "tiktoken>=0.5.1",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "bilibili-api-python>=16.0.0",
    "httpx>=0.24.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "ruptures>=1.1.7",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.2.0",
    "ruff>=0.1.0",
]

[project.scripts]
danmaku-analyzer = "danmaku_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["danmaku_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["danmaku_analyzer"]
omit = [
    "tests/*",
    "scripts/*",
    "danmaku_analyzer/data/*",
    "danmaku_analyzer/lexicon/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.",
    "pass",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
fail_under = 50

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
